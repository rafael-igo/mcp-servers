# ============================================================
# Docker Compose - APENAS MCPs que PRECISAM de Docker
# ============================================================
# Os demais MCPs rodam via Python local (ver .mcp.json)
#
# MCPs em Docker:
#   - docker-admin: Precisa de acesso ao Docker socket
#   - api-database-tester: Precisa de ODBC Driver 18 (Linux)
#
# MCPs via Python local (não precisam de Docker):
#   - excel-server
#   - agente-orchestrator
#   - memory-manager
#   - checklist-validator
#   - agente-insights
#   - agente-resumo
#   - igo-openai-gateway
#   - vuetify-uiux
# ============================================================

services:
  # ================================
  # Docker Admin MCP
  # ================================
  # Precisa de Docker para gerenciar containers
  docker-admin:
    build: ./docker-admin
    container_name: igo-docker-admin
    stdin_open: true
    tty: true
    privileged: true  # Necessário para gerenciar Docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Socket do Docker
      - ./docs:/app/docs  # Documentação
      - ../../:/project:ro  # Read-only acesso ao projeto
    restart: unless-stopped
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "python", "-c", "import docker; docker.from_env().ping()"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ================================
  # API & Database Tester MCP
  # ================================
  # Precisa de Docker para ODBC Driver 18 (Linux)
  api-database-tester:
    build: ./api-database-tester
    container_name: igo-api-database-tester
    stdin_open: true
    tty: true
    volumes:
      - ../../:/project:ro  # Read-only acesso ao projeto
    restart: unless-stopped
    networks:
      - mcp-network
    environment:
      - DEFAULT_TIMEOUT=30
    healthcheck:
      test: ["CMD", "python", "-c", "import pyodbc; print(pyodbc.drivers())"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  mcp-network:
    driver: bridge
