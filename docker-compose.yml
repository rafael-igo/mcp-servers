# ============================================================
# Docker Compose - TODOS os 10 MCPs
# ============================================================
# Para acesso remoto via SSH de Windows → Linux
# Windows não consegue acessar Python diretamente via SSH
# Por isso todos os MCPs rodam em containers Docker
#
# Para uso LOCAL (desenvolvimento no servidor Linux):
#   - Pode usar apenas Python local (mais rápido)
#   - Veja: .mcp.json (aponta para python3 local)
# ============================================================

services:
  # ================================
  # Excel Server MCP
  # ================================
  excel-server:
    build: ./excel-server
    container_name: igo-excel-server
    stdin_open: true
    tty: true
    volumes:
      - ../../:/project:ro  # Read-only acesso ao projeto
    restart: unless-stopped
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "python", "-c", "import openpyxl; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ================================
  # Agente Orchestrator MCP
  # ================================
  agente-orchestrator:
    build: ./agente-orchestrator
    container_name: igo-agente-orchestrator
    stdin_open: true
    tty: true
    volumes:
      - ../../:/project:ro  # Read-only acesso ao projeto
    restart: unless-stopped
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "python", "-c", "print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ================================
  # Memory Manager MCP
  # ================================
  memory-manager:
    build: ./memory-manager
    container_name: igo-memory-manager
    stdin_open: true
    tty: true
    volumes:
      - ../../:/project  # Read-write para atualizar memória
    restart: unless-stopped
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ================================
  # Checklist Validator MCP
  # ================================
  checklist-validator:
    build: ./checklist-validator
    container_name: igo-checklist-validator
    stdin_open: true
    tty: true
    volumes:
      - ../../:/project  # Read-write para atualizar checklists
    restart: unless-stopped
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "python", "-c", "print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ================================
  # Agente Insights MCP
  # ================================
  agente-insights:
    build: ./agente-insights
    container_name: igo-agente-insights
    stdin_open: true
    tty: true
    volumes:
      - ./docs:/app/docs  # Persistência de insights
      - ../../:/project:ro  # Read-only acesso ao projeto
    restart: unless-stopped
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "python", "-c", "print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ================================
  # Agente Resumo MCP
  # ================================
  agente-resumo:
    build: ./agente-resumo
    container_name: igo-agente-resumo
    stdin_open: true
    tty: true
    volumes:
      - ./docs:/app/docs  # Persistência de dados
      - ../../:/project:ro  # Read-only acesso ao projeto
    restart: unless-stopped
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "python", "-c", "print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ================================
  # Docker Admin MCP
  # ================================
  docker-admin:
    build: ./docker-admin
    container_name: igo-docker-admin
    stdin_open: true
    tty: true
    privileged: true  # Necessário para gerenciar Docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Socket do Docker
      - ./docs:/app/docs  # Documentação
      - ../../:/project:ro  # Read-only acesso ao projeto
    restart: unless-stopped
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "python", "-c", "import docker; docker.from_env().ping()"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ================================
  # OpenAI Gateway MCP
  # ================================
  igo-openai-gateway:
    build: ./igo-openai-gateway
    container_name: igo-openai-gateway
    stdin_open: true
    tty: true
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - ../../:/project:ro  # Read-only acesso ao projeto
    restart: unless-stopped
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "python", "-c", "import openai; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ================================
  # API & Database Tester MCP
  # ================================
  api-database-tester:
    build: ./api-database-tester
    container_name: igo-api-database-tester
    stdin_open: true
    tty: true
    volumes:
      - ../../:/project:ro  # Read-only acesso ao projeto
    restart: unless-stopped
    networks:
      - mcp-network
    environment:
      - DEFAULT_TIMEOUT=30
    healthcheck:
      test: ["CMD", "python", "-c", "import pyodbc; print(pyodbc.drivers())"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ================================
  # Vuetify UI/UX MCP
  # ================================
  vuetify-uiux:
    build: ./vuetify-uiux
    container_name: igo-vuetify-uiux
    stdin_open: true
    tty: true
    volumes:
      - ../../:/project:ro  # Read-only acesso ao projeto
    restart: unless-stopped
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "python", "-c", "print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  mcp-network:
    driver: bridge
